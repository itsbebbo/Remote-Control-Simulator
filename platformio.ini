[platformio]
; Keeps the build tree off the Google Drive path, where the sync client
; locks firmware.bin mid-build and every object file is synced.
workspace_dir = C:/pio/workspaces/Crossfire-Tester

[env:m5stack-core2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/limit_build_jobs.py
lib_deps =
    ; M5Unified replaces the older M5Core2 library, which only builds against
    ; arduino-esp32 2.x. This platform release ships arduino-esp32 3.3.x.
    m5stack/M5Unified@^0.2.0
    lvgl/lvgl@^8.3.11
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
